version: "3.8"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dastavez_api
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=development
      - DEBUG=true
      - QDRANT_URL=http://qdrant:6333
    env_file:
      - .env
    volumes:
      - .:/app
    depends_on:
      - qdrant
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.12.1
    container_name: dastavez_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

volumes:
  qdrant_data:
